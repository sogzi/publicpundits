# Supabase project configuration
# Docs: https://supabase.com/docs/guides/cli/config

[project]
# Find your project ref in: Supabase Dashboard → Project Settings → General → Reference ID
# Replace the placeholder below with your actual project ref.
id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

  [auth.email]
  enable_signup = true
  double_confirm_changes = true
  enable_confirmations = false

# ── Edge Functions ────────────────────────────────────────────────────────────

[functions.sync-match-results]
verify_jwt = false   # called by pg_cron with service-role bearer token

# Cron schedule is defined in supabase/migrations/006_match_events.sql via pg_cron.
# To manually invoke during development:
#   curl -X POST http://localhost:54321/functions/v1/sync-match-results
